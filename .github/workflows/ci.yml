name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write # Required by OWASP ZAP action when issue reporting is evaluated

env:
  NODE_VERSION: "25"
  APP_PORT: "3000" # Port your containerized web app listens on for DAST scanning
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

# ============================================================================
# Execution graph
#
#   Wave 1 (fully parallel, no dependencies):
#     secrets-scan · trufflehog-scan · codeql · sast · hadolint
#     trivy-fs-scan · sca · quality
#
#   Wave 2:  test (needs quality) -> build (needs test)
#   Wave 3:  image-scan (needs build) -> owasp-zap-scan (needs image-scan)
#   Gate:    push-image (needs every job above)
#   Always:  notify-email, slack-notify
# ============================================================================

jobs:
  # --------------------------------------------------------------------
  # WAVE 1 — parallel security and quality checks
  # --------------------------------------------------------------------

  # 1. Secrets scanning - Gitleaks
  secrets-scan:
    name: 1. Secrets scanning - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so secret scanners see all commits

      - name: Secrets scanning - Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Secrets scanning - TruffleHog (findings are reported but do not fail the job)
  trufflehog-scan:
    name: 2. Secrets scanning - TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the commit range is available

      - name: Secrets scanning - TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.3
        continue-on-error: true # ignore findings; the job still reports success
        with:
          path: ./
          extra_args: --results=verified,unknown --no-update
          # base/head intentionally omitted: the action derives the range from the event

  # 3. Static analysis - CodeQL
  codeql:
    name: 3. Static analysis - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none # JS/TS is interpreted, so no build step is needed
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # 4. Static analysis - Semgrep
  sast:
    name: 4. Static analysis - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Static code analysis - Semgrep
        id: semgrep-scan
        continue-on-error: true # findings surface as SARIF in the Security tab
        run: semgrep --config p/owasp-top-ten --sarif --output results.sarif .

      - name: Upload Semgrep SARIF
        if: always() && steps.semgrep-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: semgrep

  # 5. Dockerfile lint - Hadolint
  hadolint:
    name: 5. Dockerfile lint - Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile - Hadolint
        id: hadolint-scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true # monitor-only; findings surface as SARIF in the Security tab

      - name: Upload Hadolint SARIF
        if: always() && steps.hadolint-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  # 6. Trivy filesystem scan (source code & dependencies)
  trivy-fs-scan:
    name: 6. Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        id: trivy-fs-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: "0" # monitor-only; findings surface as SARIF in the Security tab
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy filesystem SARIF
        if: always() && steps.trivy-fs-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  # 7. Software Composition Analysis - OWASP Dependency-Check
  sca:
    name: 7. Software composition analysis - OWASP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency check - OWASP Dependency-Check
        id: owasp-sca
        continue-on-error: true # NVD database sync can be flaky; results are uploaded regardless
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: "saas-web-application"
          path: "."
          format: "SARIF"
          out: "reports"
          args: "--failOnCVSS 7 --enableRetired --prettyPrint"

      - name: Upload OWASP Dependency-Check SARIF
        if: always() && steps.owasp-sca.conclusion != 'skipped'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check
          path: reports/
          if-no-files-found: ignore

  # 8. Code quality (lint + format)
  quality:
    name: 8. Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code quality & lint - ESLint
        run: npm run lint

      - name: Format check - Prettier
        run: npm run format:check

  # --------------------------------------------------------------------
  # WAVE 2 — tests and build
  # --------------------------------------------------------------------

  # 9. Unit tests + coverage
  test:
    name: 9. Unit tests & coverage
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Code coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # 10. Build application + Docker image (shared as an artifact)
  build:
    name: 10. Build application & image
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application - npm
        run: npm run build

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            saas-web-application:${{ steps.meta.outputs.tag }}
            saas-web-application:ci

      - name: Save Docker image artifact
        run: docker save saas-web-application:ci | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: image.tar.gz
          retention-days: 1

  # --------------------------------------------------------------------
  # WAVE 3 — image scanning and DAST
  # --------------------------------------------------------------------

  # 11. Container image scanning (Trivy + Grype) & SBOM (Syft)
  image-scan:
    name: 11. Container image scan & SBOM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: image/

      - name: Load Docker image
        run: gunzip -c image/image.tar.gz | docker load

      - name: Container image scan - Trivy
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saas-web-application:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: "0" # monitor-only; findings surface as SARIF in the Security tab
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        if: always() && steps.trivy-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Container image scan - Grype
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: saas-web-application:ci
          fail-build: false # monitor-only; findings surface as SARIF in the Security tab
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype-scan.conclusion != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Generate SBOM - Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: saas-web-application:ci
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: ignore

  # 12. Dynamic Application Security Testing (DAST - OWASP ZAP)
  owasp-zap-scan:
    name: 12. OWASP ZAP DAST scan
    runs-on: ubuntu-latest
    needs: image-scan
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: image/

      - name: Load Docker image
        run: gunzip -c image/image.tar.gz | docker load

      - name: Start application container for DAST
        run: |
          docker run -d --name dast-target \
            -p "${APP_PORT}:${APP_PORT}" \
            saas-web-application:ci

          echo "Waiting for application to listen on http://localhost:${APP_PORT}..."
          for i in {1..30}; do
            if curl -s -o /dev/null "http://localhost:${APP_PORT}"; then
              echo "Application is up and ready!"
              break
            fi
            sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan
        id: zap-scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          cmd_options: "-a -j"
          fail_action: false # monitor-only; set to true to fail build on ZAP alerts
          allow_issue_writing: false

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore

      - name: Stop application container
        if: always()
        run: docker rm -f dast-target || true

  # --------------------------------------------------------------------
  # GATE — push only when every upstream job has finished
  # --------------------------------------------------------------------

  # 13. Push image to Docker Hub (main branch only, secrets required)
  push-image:
    name: 13. Push image to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - trufflehog-scan
      - codeql
      - sast
      - hadolint
      - trivy-fs-scan
      - sca
      - quality
      - test
      - build
      - image-scan
      - owasp-zap-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: image/

      - name: Load Docker image
        run: gunzip -c image/image.tar.gz | docker load

      - name: Tag and push image
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag saas-web-application:ci "$DOCKERHUB_USERNAME/saas-web-application:latest"
          docker tag saas-web-application:ci "$DOCKERHUB_USERNAME/saas-web-application:${GITHUB_SHA::8}"
          docker push "$DOCKERHUB_USERNAME/saas-web-application:latest"
          docker push "$DOCKERHUB_USERNAME/saas-web-application:${GITHUB_SHA::8}"

  # --------------------------------------------------------------------
  # NOTIFICATIONS
  # --------------------------------------------------------------------

  # 14. Email notification (pipeline status)
  notify:
    name: 14. Email notification
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - trufflehog-scan
      - codeql
      - sast
      - hadolint
      - trivy-fs-scan
      - sca
      - quality
      - test
      - build
      - image-scan
      - owasp-zap-scan
      - push-image
    if: always() # run regardless of upstream success/failure/skip
    timeout-minutes: 5
    steps:
      - name: Compute pipeline status
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "result=cancelled" >> "$GITHUB_OUTPUT"
            echo "emoji=⚠️" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate notification config
        run: |
          missing=()
          [[ -z "${{ vars.EMAIL_TO }}" ]] && missing+=("EMAIL_TO (repo variable)")
          [[ -z "${{ secrets.EMAIL_SMTP_SERVER }}" ]] && missing+=("EMAIL_SMTP_SERVER (secret)")
          [[ -z "${{ secrets.EMAIL_SMTP_PORT }}" ]] && missing+=("EMAIL_SMTP_PORT (secret)")
          [[ -z "${{ secrets.EMAIL_USERNAME }}" ]] && missing+=("EMAIL_USERNAME (secret)")
          [[ -z "${{ secrets.EMAIL_PASSWORD }}" ]] && missing+=("EMAIL_PASSWORD (secret)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required config: ${missing[*]}. Set these under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: ${{ secrets.EMAIL_SMTP_SERVER }}
          server_port: ${{ secrets.EMAIL_SMTP_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} [${{ github.repository }}] DevSecOps CI/CD - ${{ steps.status.outputs.result }} (${{ github.ref_name }})"
          to: ${{ vars.EMAIL_TO }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h2>${{ steps.status.outputs.emoji }} DevSecOps CI/CD Pipeline — ${{ steps.status.outputs.result }}</h2>
            <table cellpadding="6" cellspacing="0" border="1" style="border-collapse:collapse;font-family:sans-serif;font-size:14px;">
              <tr><td><b>Repository</b></td><td>${{ github.repository }}</td></tr>
              <tr><td><b>Branch / Ref</b></td><td>${{ github.ref_name }}</td></tr>
              <tr><td><b>Triggered by</b></td><td>${{ github.actor }}</td></tr>
              <tr><td><b>Event</b></td><td>${{ github.event_name }}</td></tr>
              <tr><td><b>Commit</b></td><td>${{ github.sha }}</td></tr>
              <tr><td><b>1. Secrets scan (Gitleaks)</b></td><td>${{ needs['secrets-scan'].result }}</td></tr>
              <tr><td><b>2. Secrets scan (TruffleHog)</b></td><td>${{ needs['trufflehog-scan'].result }}</td></tr>
              <tr><td><b>3. CodeQL</b></td><td>${{ needs.codeql.result }}</td></tr>
              <tr><td><b>4. SAST (Semgrep)</b></td><td>${{ needs.sast.result }}</td></tr>
              <tr><td><b>5. Dockerfile lint (Hadolint)</b></td><td>${{ needs.hadolint.result }}</td></tr>
              <tr><td><b>6. Trivy filesystem scan</b></td><td>${{ needs['trivy-fs-scan'].result }}</td></tr>
              <tr><td><b>7. SCA (OWASP Dependency-Check)</b></td><td>${{ needs.sca.result }}</td></tr>
              <tr><td><b>8. Lint & format</b></td><td>${{ needs.quality.result }}</td></tr>
              <tr><td><b>9. Unit tests</b></td><td>${{ needs.test.result }}</td></tr>
              <tr><td><b>10. Build</b></td><td>${{ needs.build.result }}</td></tr>
              <tr><td><b>11. Image scan & SBOM</b></td><td>${{ needs['image-scan'].result }}</td></tr>
              <tr><td><b>12. DAST (OWASP ZAP)</b></td><td>${{ needs['owasp-zap-scan'].result }}</td></tr>
              <tr><td><b>13. Push image</b></td><td>${{ needs['push-image'].result }}</td></tr>
            </table>
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View full run details
              </a>
            </p>

  # 15. Slack notification (pipeline status)
  slack-notify:
    name: 15. Slack notification
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - trufflehog-scan
      - codeql
      - sast
      - hadolint
      - trivy-fs-scan
      - sca
      - quality
      - test
      - build
      - image-scan
      - owasp-zap-scan
      - push-image
    if: always() # run regardless of upstream success/failure/skip
    timeout-minutes: 5
    steps:
      - name: Compute pipeline status
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "color=#e01e5a" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "result=cancelled" >> "$GITHUB_OUTPUT"
            echo "emoji=:warning:" >> "$GITHUB_OUTPUT"
            echo "color=#ecb22e" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            echo "color=#2eb67d" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Slack webhook is configured
        run: |
          if [[ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
            echo "::error::SLACK_WEBHOOK_URL secret is not set. Go to Settings > Secrets and variables > Actions > Secrets and add SLACK_WEBHOOK_URL with your Slack Incoming Webhook URL."
            exit 1
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS_RESULT: ${{ steps.status.outputs.result }}
          STATUS_EMOJI: ${{ steps.status.outputs.emoji }}
          STATUS_COLOR: ${{ steps.status.outputs.color }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "${STATUS_COLOR}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${STATUS_EMOJI} DevSecOps CI/CD - ${STATUS_RESULT}",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                      { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                      { "type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}" },
                      { "type": "mrkdwn", "text": "*Event:*\n${{ github.event_name }}" },
                      { "type": "mrkdwn", "text": "*Commit:*\n\`${{ github.sha }}\`" }
                    ]
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*1. Secrets (Gitleaks):*\n${{ needs['secrets-scan'].result }}" },
                      { "type": "mrkdwn", "text": "*2. Secrets (TruffleHog):*\n${{ needs['trufflehog-scan'].result }}" },
                      { "type": "mrkdwn", "text": "*3. CodeQL:*\n${{ needs.codeql.result }}" },
                      { "type": "mrkdwn", "text": "*4. SAST (Semgrep):*\n${{ needs.sast.result }}" },
                      { "type": "mrkdwn", "text": "*5. Hadolint:*\n${{ needs.hadolint.result }}" },
                      { "type": "mrkdwn", "text": "*6. Trivy FS scan:*\n${{ needs['trivy-fs-scan'].result }}" },
                      { "type": "mrkdwn", "text": "*7. SCA (OWASP):*\n${{ needs.sca.result }}" }
                    ]
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*8. Lint & format:*\n${{ needs.quality.result }}" },
                      { "type": "mrkdwn", "text": "*9. Unit tests:*\n${{ needs.test.result }}" },
                      { "type": "mrkdwn", "text": "*10. Build:*\n${{ needs.build.result }}" },
                      { "type": "mrkdwn", "text": "*11. Image scan & SBOM:*\n${{ needs['image-scan'].result }}" },
                      { "type": "mrkdwn", "text": "*12. DAST (OWASP ZAP):*\n${{ needs['owasp-zap-scan'].result }}" },
                      { "type": "mrkdwn", "text": "*13. Push image:*\n${{ needs['push-image'].result }}" }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "View full run" },
                        "url": "${run_url}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "${payload}" \
